kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      replicas: 1
      retention: 3d
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
      tolerations:
        - key: dedicated
          operator: Equal
          value: observability
          effect: NoSchedule

  alertmanager:
    alertmanagerSpec:
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi

  grafana:
    deploymentStrategy:
      type: RollingUpdate
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 384Mi
    tolerations:
      - key: dedicated
        operator: Equal
        value: observability
        effect: NoSchedule
    grafana.ini:
      server:
        root_url: "%(protocol)s://%(domain)s/grafana/"
        serve_from_sub_path: true

  prometheusOperator:
    admissionWebhooks:
      patch:
        ttlSecondsAfterFinished: 3600
        tolerations:
          - key: dedicated
            operator: Equal
            value: observability
            effect: NoSchedule
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 384Mi
